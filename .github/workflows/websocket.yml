name: websocket

on:
  push:
    branches: [feat/websocket-output]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate embedded assets
        run: go generate ./...
      - name: Test WebSocket and connected packages with race detection
        run: go test -race -timeout 10m ./internal/servers/ws ./internal/stream ./internal/auth ./internal/conf ./internal/protocols/httpp ./internal/core
      - name: Test existing output servers
        run: go test -race -timeout 10m ./internal/servers/...
      - name: Build Linux and Windows binaries
        run: |
          mkdir -p binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o binaries/tdt-media-stream-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o binaries/tdt-media-stream-windows-amd64.exe .
          cp mediamtx.yml binaries/
          cp docs/websocket.md binaries/
          cp docs/websocket-integration.md binaries/
          cp docs/websocket-player.html binaries/
      - name: Check program name
        run: ./binaries/tdt-media-stream-linux-amd64 --help | grep tdt-media-stream
      - uses: actions/upload-artifact@v7
        with:
          name: tdt-media-stream-websocket
          path: binaries/
      - name: Install browser validation tools
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          npm install --prefix tmp/ws-browser --no-save --package-lock=false playwright
          tmp/ws-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate real RTSP input and browser video
        run: node scripts/websocket-browser-test.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: websocket-browser-results
          path: tmp/ws-browser-results/
